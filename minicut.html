<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>MiniCut — Editor de Vídeo</title>
<style>
:root{--red:#ff2028;--black:#050505;--panel:#0d0d0d;--line:#292929;--muted:#9b9b9b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input{font:inherit}button{color:#fff}
.app{height:100dvh;display:flex;flex-direction:column;background:#000}.topbar{height:68px;min-height:68px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line);background:#080808}.logo{font-size:28px;font-weight:900}.logo span{color:var(--red)}.spacer{flex:1}.iconbtn,.export,.action{border:1px solid #333;background:#111;border-radius:10px;padding:10px 13px;font-weight:800}.iconbtn{width:44px;height:44px;padding:0;font-size:22px}.export,.action.red{background:var(--red);border-color:var(--red)}
.workspace{flex:1;min-height:0;display:flex}.sidebar{width:190px;min-width:190px;background:#090909;border-right:1px solid var(--line);padding:12px 9px;display:flex;flex-direction:column;gap:3px}.tool{width:100%;border:1px solid transparent;background:transparent;border-radius:11px;padding:11px 9px;text-align:left;font-weight:800;display:flex;align-items:center;gap:11px}.tool .ico{font-size:23px;width:29px;text-align:center}.tool small{display:block;color:var(--muted);font-weight:500;margin-top:2px}.tool:hover,.tool.active{background:#190606;border-color:#781016}.tool.active .ico{color:var(--red)}.collapse{margin-top:auto;border:1px solid #333;background:#111;border-radius:50%;width:38px;height:38px;align-self:center}
.editor{flex:1;min-width:0;display:flex;flex-direction:column}.previewArea{flex:1;min-height:230px;padding:16px;display:flex;align-items:center;justify-content:center;background:#020202}.viewer{position:relative;width:min(100%,980px);height:100%;min-height:200px;background:#000;border:1px solid #242424;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center}.viewer video{max-width:100%;max-height:100%;display:none}.empty{text-align:center;color:var(--muted);padding:25px}.empty .big{font-size:24px;font-weight:900;color:#fff;margin-bottom:7px}.overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:35px}.overlayText{font-size:42px;font-weight:900;text-align:center;text-shadow:0 3px 12px #000;white-space:pre-wrap;word-break:break-word}.overlayImage{position:absolute;max-width:45%;max-height:45%;object-fit:contain;display:none;border-radius:8px}
.controls{height:66px;display:flex;align-items:center;gap:9px;padding:9px 16px;border-top:1px solid var(--line);background:#090909}.play{width:45px;height:43px;border-radius:10px;border:1px solid #444;background:#151515;font-size:20px}.time{font-variant-numeric:tabular-nums;font-size:13px;color:#bbb}.seek{flex:1;accent-color:var(--red)}
.timelineWrap{height:220px;min-height:220px;background:#090909;border-top:1px solid var(--line);overflow:auto;position:relative}.ruler{height:34px;position:relative;border-bottom:1px solid #202020;color:#777;font-size:11px}.ruler span{position:absolute;top:9px}.tracks{min-width:800px}.trackRow{height:38px;display:flex;border-bottom:1px solid #1b1b1b}.trackLabel{width:105px;min-width:105px;display:flex;align-items:center;gap:7px;padding-left:13px;font-size:12px;font-weight:800;background:#0b0b0b;border-right:1px solid #222}.trackLane{position:relative;flex:1;background:repeating-linear-gradient(90deg,#090909 0,#090909 79px,#111 80px)}.clipItem{position:absolute;top:4px;height:29px;border-radius:7px;border:1px solid #e31a22;background:#35070a;display:flex;align-items:center;padding:0 8px;overflow:hidden;white-space:nowrap;font-size:11px;font-weight:800}.clipItem.image{border-color:#a31a1f;background:#241010}.clipItem.audio{border-color:#555;background:#171717}.clipItem.text{border-color:var(--red);background:#3b090c}.playhead{position:absolute;top:34px;bottom:0;width:2px;background:var(--red);z-index:5;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:-6px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--red)}
.bottomTools{height:62px;min-height:62px;border-top:1px solid var(--line);display:flex;background:#080808}.bottomTool{flex:1;border:0;border-right:1px solid #222;background:transparent;font-size:10px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.bottomTool b{font-size:21px}.bottomTool:hover{background:#160607;color:var(--red)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal.show{display:flex}.sheet{width:min(560px,100%);background:#111;border:1px solid #333;border-bottom:0;border-radius:18px 18px 0 0;padding:18px;max-height:85dvh;overflow:auto}.sheet h2{margin:0 0 15px}.field{margin:12px 0}.field label{display:block;color:#aaa;font-size:12px;margin-bottom:6px}.field input[type=text]{width:100%;background:#090909;border:1px solid #383838;color:#fff;border-radius:9px;padding:11px}.range{width:100%;accent-color:var(--red)}.row{display:flex;gap:10px}.row>*{flex:1}.close{float:right}.toast{position:fixed;z-index:50;left:50%;bottom:20px;transform:translate(-50%,15px);opacity:0;background:#fff;color:#111;padding:10px 14px;border-radius:10px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.topbar{height:58px;min-height:58px;padding:0 8px;gap:7px}.logo{font-size:21px}.sidebar{width:76px;min-width:76px;padding:7px 4px}.tool{justify-content:center;padding:10px 3px}.tool .ico{font-size:22px}.tool span:not(.ico),.tool small{display:none}.previewArea{padding:7px}.viewer{min-height:180px}.controls{height:56px;padding:6px 8px}.timelineWrap{height:180px;min-height:180px}.bottomTools{height:55px;min-height:55px}.bottomTool b{font-size:17px}.bottomTool{font-size:8px}.export{padding:8px 9px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><button class="iconbtn" id="menu">☰</button><div class="logo">Mini<span>Cut</span></div><div class="spacer"></div><button class="iconbtn" id="undo">↶</button><button class="iconbtn" id="redo">↷</button><button class="export" id="export">⇧ EXPORTAR</button></header>
<div class="workspace">
<aside class="sidebar">
<button class="tool active" id="cutTool"><span class="ico">✂</span><span>CORTAR<small>Selecionar trecho</small></span></button>
<button class="tool" id="imageTool"><span class="ico">▧</span><span>IMAGENS<small>Adicionar foto</small></span></button>
<button class="tool" id="videoTool"><span class="ico">▣</span><span>VÍDEOS<small>Adicionar vídeo</small></span></button>
<button class="tool" id="musicTool"><span class="ico">♫</span><span>MÚSICA<small>Adicionar áudio</small></span></button>
<button class="tool" id="textTool"><span class="ico">T</span><span>TEXTO<small>Colocar texto</small></span></button>
<button class="tool" id="volumeTool"><span class="ico">◖</span><span>VOLUME<small>Ajustar som</small></span></button>
<button class="tool" id="recordTool"><span class="ico">●</span><span>GRAVAR<small>Câmera + voz</small></span></button>
<button class="tool" id="newTool"><span class="ico">＋</span><span>NOVO<small>Projeto vazio</small></span></button><button class="collapse">«</button>
</aside>
<section class="editor">
<div class="previewArea"><div class="viewer" id="viewer"><video id="video" playsinline preload="metadata"></video><div class="empty" id="empty"><div class="big">MiniCut</div><div>Seu editor de vídeo vermelho e preto</div><button class="action red" id="chooseMain">＋ Escolher vídeo</button></div><div class="overlay"><div class="overlayText" id="overlayText"></div><img class="overlayImage" id="overlayImage"></div></div></div>
<div class="controls"><button class="play" id="play">▶</button><span class="time" id="cur">00:00</span><input class="seek" id="seek" type="range" min="0" max="0" step=".01" value="0"><span class="time" id="dur">00:00</span></div>
<div class="timelineWrap"><div class="ruler" id="ruler"></div><div class="tracks"><div class="trackRow"><div class="trackLabel">▣ VÍDEO</div><div class="trackLane" id="videoLane"></div></div><div class="trackRow"><div class="trackLabel">▧ IMAGEM</div><div class="trackLane" id="imageLane"></div></div><div class="trackRow"><div class="trackLabel">T TEXTO</div><div class="trackLane" id="textLane"></div></div><div class="trackRow"><div class="trackLabel">♫ ÁUDIO</div><div class="trackLane" id="audioLane"></div></div><div class="trackRow"><div class="trackLabel">● GRAVAÇÃO</div><div class="trackLane" id="recordLane"></div></div></div><div class="playhead" id="playhead"></div></div>
<div class="bottomTools"><button class="bottomTool" id="addBtn"><b>＋</b>ADICIONAR</button><button class="bottomTool" id="splitBtn"><b>◫</b>DIVIDIR</button><button class="bottomTool" id="deleteBtn"><b>▢</b>EXCLUIR</button><button class="bottomTool" id="speedBtn"><b>◔</b>VELOCIDADE</button><button class="bottomTool" id="cropBtn"><b>⌗</b>CORTAR</button><button class="bottomTool" id="filterBtn"><b>◌</b>FILTROS</button><button class="bottomTool" id="settingsBtn"><b>☷</b>AJUSTES</button></div>
</section></div></div>
<input id="mainFile" type="file" accept="video/*" hidden><input id="imageFile" type="file" accept="image/*" hidden><input id="extraVideoFile" type="file" accept="video/*" hidden><input id="audioFile" type="file" accept="audio/*" hidden>
<div class="modal" id="modal"><div class="sheet"><button class="action close" id="close">Fechar</button><h2 id="modalTitle">MiniCut</h2><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
'use strict';
const $=id=>document.getElementById(id),v=$('video');let mainURL=null,imageURL=null,bgAudio=null,start=0,end=0,textValue='',history=[],hi=-1,selected=null,recorder=null,recStream=null,chunks=[];
const fmt=s=>{s=Number(s)||0;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};
function msg(t){let x=$('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}
function modal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('show')}$('close').onclick=()=>$('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};
function save(){history=history.slice(0,hi+1);history.push({start,end,text:textValue});hi=history.length-1}function restore(s){start=s.start;end=s.end;textValue=s.text||'';$('overlayText').textContent=textValue;updateClip()}
$('undo').onclick=()=>{if(hi>0){hi--;restore(history[hi]);msg('Desfeito')}else msg('Nada para desfazer')};$('redo').onclick=()=>{if(hi<history.length-1){hi++;restore(history[hi]);msg('Refeito')}else msg('Nada para refazer')};
function loadMain(f){if(!f)return;if(mainURL)URL.revokeObjectURL(mainURL);mainURL=URL.createObjectURL(f);v.src=mainURL;$('empty').style.display='none';msg('Vídeo carregado')}$('chooseMain').onclick=()=>$('mainFile').click();$('cutTool').onclick=()=>v.src?openCut():$('mainFile').click();$('mainFile').onchange=e=>{loadMain(e.target.files[0]);e.target.value=''};
v.onloadedmetadata=()=>{start=0;end=v.duration||0;$('seek').max=end;$('dur').textContent=fmt(end);updateClip();ruler();save()};$('play').onclick=()=>{if(!v.src){msg('Escolha um vídeo primeiro');return}v.paused?v.play():v.pause()};v.onplay=()=>{$('play').textContent='❚❚';if(bgAudio)bgAudio.play().catch(()=>{})};v.onpause=()=>{$('play').textContent='▶';if(bgAudio)bgAudio.pause()};v.ontimeupdate=()=>{$('seek').value=v.currentTime;$('cur').textContent=fmt(v.currentTime);playhead();if(end&&v.currentTime>=end){v.pause();v.currentTime=start}};$('seek').oninput=e=>{v.currentTime=+e.target.value;playhead()};
function updateClip(){let l=$('videoLane');l.innerHTML='';if(!v.duration)return;let c=document.createElement('div');c.className='clipItem';c.style.left=start/v.duration*100+'%';c.style.width=(end-start)/v.duration*100+'%';c.textContent='Vídeo • '+fmt(start)+' — '+fmt(end);c.onclick=()=>{selected=c;c.style.outline='2px solid #fff'};l.appendChild(c)}
function playhead(){if(!v.duration)return;let l=$('videoLane'),x=105+(v.currentTime/v.duration)*l.clientWidth;$('playhead').style.left=x+'px'}function ruler(){let r=$('ruler');r.innerHTML='';if(!v.duration)return;for(let i=0;i<=v.duration;i+=5){let s=document.createElement('span');s.textContent=fmt(i);s.style.left=105+(i/v.duration)*$('videoLane').clientWidth+'px';r.appendChild(s)}}window.onresize=()=>{ruler();playhead()};
function openCut(){modal('Cortar trecho',`<div class="field"><label>Início: <b id="sl">${fmt(start)}</b></label><input id="sr" class="range" type="range" min="0" max="${v.duration||0}" step=".01" value="${start}"></div><div class="field"><label>Fim: <b id="el">${fmt(end)}</b></label><input id="er" class="range" type="range" min="0" max="${v.duration||0}" step=".01" value="${end}"></div><div class="row"><button class="action" id="pc">▶ Prévia</button><button class="action red" id="ac">Aplicar corte</button></div>`);$('sr').oninput=e=>{start=Math.min(+e.target.value,end-.05);$('sl').textContent=fmt(start);updateClip()};$('er').oninput=e=>{end=Math.max(+e.target.value,start+.05);$('el').textContent=fmt(end);updateClip()};$('pc').onclick=()=>{v.currentTime=start;v.play();$('modal').classList.remove('show')};$('ac').onclick=()=>{save();$('modal').classList.remove('show');msg('Corte aplicado')}}
$('imageTool').onclick=()=>$('imageFile').click();$('imageFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(imageURL)URL.revokeObjectURL(imageURL);imageURL=URL.createObjectURL(f);$('overlayImage').src=imageURL;$('overlayImage').style.display='block';addItem('imageLane','▧ '+f.name,'image',20);msg('Imagem adicionada');e.target.value=''};
$('videoTool').onclick=()=>$('extraVideoFile').click();$('extraVideoFile').onchange=e=>{let f=e.target.files[0];if(!f)return;addItem('videoLane','▣ '+f.name,'',18);msg('Vídeo adicionado à timeline');e.target.value=''};
function addItem(lane,label,cls,width){let x=document.createElement('div');x.className='clipItem '+cls;x.style.left=(v.duration?v.currentTime/v.duration*100:0)+'%';x.style.width=width+'%';x.textContent=label;x.onclick=()=>{selected=x;x.style.outline='2px solid #fff'};$(lane).appendChild(x)}
$('textTool').onclick=()=>{modal('Texto',`<div class="field"><label>Texto</label><input id="ti" type="text" value="${textValue.replace(/"/g,'&quot;')}" placeholder="Digite seu texto"></div><div class="field"><label>Tamanho: <b id="tl">42</b>px</label><input id="tr" class="range" type="range" min="18" max="90" value="42"></div><button class="action red" id="at">Adicionar texto</button>`);$('ti').oninput=e=>$('overlayText').textContent=e.target.value;$('tr').oninput=e=>{$('tl').textContent=e.target.value;$('overlayText').style.fontSize=e.target.value+'px'};$('at').onclick=()=>{textValue=$('ti').value;$('overlayText').textContent=textValue;addItem('textLane','T '+textValue,'text',22);save();$('modal').classList.remove('show');msg('Texto adicionado')}};
$('musicTool').onclick=()=>$('audioFile').click();$('audioFile').onchange=e=>{let f=e.target.files[0];if(!f)return;if(bgAudio)bgAudio.pause();bgAudio=new Audio(URL.createObjectURL(f));bgAudio.loop=true;bgAudio.volume=.7;if(!v.paused)bgAudio.play().catch(()=>{});addItem('audioLane','♫ '+f.name,'audio',90);msg('Música adicionada');e.target.value=''};
$('volumeTool').onclick=()=>{modal('Volume',`<div class="field"><label>Volume: <b id="vl">${Math.round(v.volume*100)}%</b></label><input id="vr" class="range" type="range" min="0" max="1" step=".01" value="${v.volume}"></div>`);$('vr').oninput=e=>{v.volume=+e.target.value;$('vl').textContent=Math.round(v.volume*100)+'%'}};
async function record(){try{recStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});let rv=document.createElement('video');rv.srcObject=recStream;rv.muted=true;rv.playsInline=true;await rv.play();let c=document.createElement('canvas');c.width=1280;c.height=720;let ctx=c.getContext('2d'),cs=c.captureStream(30);recStream.getAudioTracks().forEach(t=>cs.addTrack(t));chunks=[];recorder=new MediaRecorder(cs,{mimeType:MediaRecorder.isTypeSupported('video/webm')?'video/webm':''});recorder.ondataavailable=e=>e.data.size&&chunks.push(e.data);recorder.onstop=()=>{addItem('recordLane','● Minha gravação','audio',25);recStream.getTracks().forEach(t=>t.stop());cs.getTracks().forEach(t=>t.stop());msg('Gravação concluída')};function draw(){if(!recorder||recorder.state!=='recording')return;ctx.drawImage(rv,0,0,c.width,c.height);requestAnimationFrame(draw)}recorder.start();draw();modal('Gravando',`<p style="color:#aaa">Câmera e microfone ativos.</p><button class="action red" id="stop">■ PARAR GRAVAÇÃO</button>`);$('stop').onclick=()=>{if(recorder&&recorder.state==='recording')recorder.stop();$('modal').classList.remove('show')}}catch(e){msg('Permita câmera e microfone')}}$('recordTool').onclick=()=>navigator.mediaDevices?.getUserMedia?record():msg('Gravação não disponível');
$('addBtn').onclick=()=>modal('Adicionar',`<div class="row"><button class="action red" id="av">Vídeo</button><button class="action" id="ai">Imagem</button></div><div class="row" style="margin-top:10px"><button class="action" id="aa">Áudio</button><button class="action" id="atx">Texto</button></div>`);$('modalBody').addEventListener('click',e=>{if(e.target.id==='av'){$('modal').classList.remove('show');$('extraVideoFile').click()}if(e.target.id==='ai'){$('modal').classList.remove('show');$('imageFile').click()}if(e.target.id==='aa'){$('modal').classList.remove('show');$('audioFile').click()}if(e.target.id==='atx'){$('modal').classList.remove('show');$('textTool').click()}});
$('deleteBtn').onclick=()=>{if(!selected){msg('Selecione um item na timeline');return}selected.remove();selected=null;msg('Item excluído')};$('speedBtn').onclick=()=>{modal('Velocidade',`<div class="field"><label>Velocidade: <b id="spd">1x</b></label><input id="spr" class="range" type="range" min=".25" max="2" step=".25" value="1"></div><button class="action red" id="asp">Aplicar</button>`);$('spr').oninput=e=>$('spd').textContent=e.target.value+'x';$('asp').onclick=()=>{v.playbackRate=+$('spr').value;$('modal').classList.remove('show');msg('Velocidade aplicada')}};
$('filterBtn').onclick=()=>{modal('Filtros',`<div class="row"><button class="action" data-f="none">Normal</button><button class="action" data-f="gray">P&B</button></div><div class="row" style="margin-top:10px"><button class="action" data-f="contrast">Contraste</button><button class="action" data-f="red">Vermelho</button></div>`);document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{let f=b.dataset.f;v.style.filter=f==='gray'?'grayscale(1)':f==='contrast'?'contrast(1.3)':f==='red'?'sepia(1) saturate(5) hue-rotate(320deg)':'none';$('modal').classList.remove('show');msg('Filtro aplicado')})};
$('cropBtn').onclick=()=>modal('Cortar imagem','<p style="color:#aaa">Ferramenta de enquadramento pronta para evolução da edição.</p>');$('settingsBtn').onclick=()=>modal('Ajustes','<p style="color:#aaa">MiniCut usa a identidade visual vermelha e preta e se adapta ao celular.</p>');
$('newTool').onclick=()=>{v.pause();v.removeAttribute('src');v.load();if(mainURL)URL.revokeObjectURL(mainURL);mainURL=null;start=end=0;textValue='';$('overlayText').textContent='';$('overlayImage').style.display='none';$('seek').max=0;$('seek').value=0;$('cur').textContent='00:00';$('dur').textContent='00:00';$('empty').style.display='block';document.querySelectorAll('.clipItem').forEach(x=>x.remove());msg('Novo projeto')};
$('export').onclick=()=>{if(!v.src){msg('Escolha um vídeo primeiro');return}if(!HTMLCanvasElement.prototype.captureStream||!window.MediaRecorder){msg('Exportação não disponível neste navegador');return}let c=document.createElement('canvas');c.width=v.videoWidth||1280;c.height=v.videoHeight||720;let ctx=c.getContext('2d'),stream=c.captureStream(30),mime='video/webm';let rec=new MediaRecorder(stream,{mimeType:mime}),cs=[];rec.ondataavailable=e=>e.data.size&&cs.push(e.data);rec.onstop=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(cs,{type:mime}));a.download='minicut-editado.webm';a.click();msg('Arquivo exportado')};v.currentTime=start;v.play();rec.start(200);msg('Exportando…');function draw(){ctx.drawImage(v,0,0,c.width,c.height);if(textValue){ctx.fillStyle='#fff';ctx.font='900 '+Math.round(42*c.width/Math.max(640,$('viewer').clientWidth))+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';ctx.shadowColor='#000';ctx.shadowBlur=12;ctx.fillText(textValue,c.width/2,c.height-45);ctx.shadowBlur=0}if(v.currentTime<end)requestAnimationFrame(draw);else{v.pause();rec.stop();stream.getTracks().forEach(t=>t.stop())}}draw()};
$('menu').onclick=()=>msg('Use o menu lateral para editar');document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active'));b.classList.add('active')});document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('play').click()}});save();
</script>
</body></html>
